<!doctype html>
<html><head><meta charset="utf-8"><title>337,000 Words of Light</title>
<style>
  html,body{margin:0;height:100%;background:#060608;overflow:hidden}
  canvas{display:block}
  .cap{position:fixed;left:0;right:0;bottom:26px;text-align:center;
    font-family:Georgia,serif;color:#8b8b8b;font-size:15px;font-style:italic;
    letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity 3s}
  .cap.show{opacity:1}
</style></head><body>
<canvas id="c"></canvas>
<div class="cap" id="cap">3,370 lights · each one is a hundred words · twenty-six years · still burning<br>
<span style="font-size:12px;color:#5c5c5c">move through them — every light is hiding a color. they always come home.</span></div>
<script>
const RAINBOW=['#ff69b4','#ff7f6e','#ff3b3b','#ff5a2b','#ff7f27','#ffb52e','#ffe135','#b6e34b',
'#4cd964','#2fd6b0','#28d5e8','#4aa8ff','#2f6bff','#5a4fff','#8a5cff','#a64cf5','#e04cf0','#ff4fd8'];
const N=3370, GOLD='#d8b24a';
const cv=document.getElementById('c'), cx=cv.getContext('2d');
let W,H,parts=[],mouse={x:-9e9,y:-9e9};

function targets(){
  const o=document.createElement('canvas'); o.width=W; o.height=H;
  const g=o.getContext('2d');
  g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='middle';
  const s=Math.min(W/9.2,H/6.2);
  g.font=`600 ${s}px Georgia, serif`;
  g.fillText('The Guardians', W/2, H/2 - s*0.62);
  g.fillText('of Lajen',      W/2, H/2 + s*0.62);
  const d=g.getImageData(0,0,W,H).data, pts=[];
  const gap=Math.max(2, Math.round(Math.sqrt((W*H)/(N*22))));
  for(let y=0;y<H;y+=gap)for(let x=0;x<W;x+=gap)
    if(d[(y*W+x)*4+3]>128) pts.push([x,y]);
  // settle on exactly N lights — the conceit matters
  while(pts.length<N) pts.push(pts[(Math.random()*pts.length)|0]);
  for(let i=pts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pts[i],pts[j]]=[pts[j],pts[i]];}
  return pts.slice(0,N);
}
function build(){
  W=cv.width=innerWidth; H=cv.height=innerHeight;
  const t=targets();
  if(!parts.length){
    parts=t.map(p=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,
      tx:p[0],ty:p[1],hue:RAINBOW[(Math.random()*RAINBOW.length)|0],glow:0,
      tw:Math.random()*6.28,r:.9+Math.random()*1.3}));
  } else parts.forEach((pt,i)=>{pt.tx=t[i][0];pt.ty=t[i][1];});
}
addEventListener('resize',build);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener('touchmove',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;},{passive:true});
addEventListener('mouseleave',()=>{mouse.x=-9e9;});
build();
setTimeout(()=>document.getElementById('cap').classList.add('show'),3800);

function frame(t){
  cx.fillStyle='rgba(6,6,8,0.28)'; cx.fillRect(0,0,W,H);
  for(const p of parts){
    // spring home
    p.vx+=(p.tx-p.x)*0.012; p.vy+=(p.ty-p.y)*0.012;
    // the cursor scatters them
    const dx=p.x-mouse.x, dy=p.y-mouse.y, d2=dx*dx+dy*dy;
    if(d2<8100){const d=Math.sqrt(d2)||1,f=(90-d)/90*2.2;
      p.vx+=dx/d*f; p.vy+=dy/d*f; p.glow=1;}
    p.vx*=0.86; p.vy*=0.86; p.x+=p.vx; p.y+=p.vy;
    p.glow*=0.955; p.tw+=0.05;
    const breath=0.55+0.45*Math.sin(p.tw);
    cx.globalAlpha=0.35+0.65*breath*(0.7+0.3*p.glow);
    cx.fillStyle=p.glow>0.06?p.hue:GOLD;
    cx.beginPath(); cx.arc(p.x,p.y,p.r+(p.glow*1.6),0,6.283); cx.fill();
  }
  cx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
