# TD-049 — Supabase keep-alive
#
# Supabase free-tier projects pause after ~7 days with no database activity.
# A paused project takes the whole Compendium offline until it is manually
# restored from the dashboard. This pings the REST API on a schedule so the
# project never goes idle long enough to be paused.
#
# SETUP (one time, GitHub web UI):
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       = https://ejjqujeabttawwnkdatd.supabase.co
#     SUPABASE_ANON_KEY  = the publishable/anon key (same one Netlify uses)
#
# The anon key is safe to store here — it already ships inside the public JS
# bundle, and every table is behind RLS with authenticated-only policies, so
# this request reads nothing. It only proves the database is awake.

name: Supabase keep-alive

on:
  schedule:
    # 07:00 UTC every Monday and Thursday — comfortably inside the ~7 day window
    # even if one run is skipped or GitHub delays the cron.
    - cron: '0 7 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY repository secrets are not set."
            echo "See the setup notes at the top of this file."
            exit 1
          fi

          # RLS denies anon every row, so this returns an empty array — that is
          # the expected and correct result. We only care that Postgres answered.
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/settings?select=key&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP ${status}"
          echo "Body: $(cat /tmp/body.txt)"

          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive ping failed with HTTP ${status}. The project may already be paused, or the secrets may be wrong."
            exit 1
          fi

          echo "Supabase is awake."
