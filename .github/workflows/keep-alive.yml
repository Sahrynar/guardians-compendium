# TD-049 — Cloud keep-alives for both active compendiums
# Uses the existing SUPABASE_URL and SUPABASE_ANON_KEY repository secrets.
# This is a best-effort free-plan keep-alive, not a guarantee against pausing.
name: Supabase keep-alive

on:
  schedule:
    # Every eight hours, away from the busy start of each hour (UTC).
    - cron: '17 1,9,17 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/keep-alive.yml']

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_ANON_KEY repository secrets are not set."
            exit 1
          fi

          # Query Postgres without retrieving or printing application records.
          # The apikey header supports both legacy anon and publishable keys.
          status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 30 \
            --output /tmp/keep-alive-body.json --write-out '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/settings?select=key&limit=0" \
            --header "apikey: ${SUPABASE_ANON_KEY}")

          echo "Compendium database ping: HTTP ${status}"
          if [ "$status" != "200" ]; then
            echo "::error::Compendium keep-alive failed. Check project state and repository secrets."
            exit 1
          fi

          python3 -c 'import json; body=json.load(open("/tmp/keep-alive-body.json")); assert body == [], "Expected an empty database response"'
          echo "Compendium database answered successfully."

  tu_ping:
    name: Tomorrow Unauthorized database keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database-only health RPC
        env:
          TU_SUPABASE_URL: https://tzxmzasttcsrnzwjgffk.supabase.co
          # Public publishable client key; no service-role privileges.
          TU_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fTeH14cjCuDpKhbfetl2lw_aXHJeLO_
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 30 \
            --output /tmp/tu-keep-alive.json --write-out '%{http_code}' \
            "${TU_SUPABASE_URL}/rest/v1/rpc/keep_alive_ping" \
            --header "apikey: ${TU_SUPABASE_PUBLISHABLE_KEY}")

          echo "Tomorrow Unauthorized database ping: HTTP ${status}"
          if [ "$status" != "200" ]; then
            echo "::error::TU database keep-alive failed. Check project status and health RPC."
            exit 1
          fi
          python3 -c 'import json; assert json.load(open("/tmp/tu-keep-alive.json")) is True, "Database health check failed"'
          echo "Tomorrow Unauthorized database answered successfully."
